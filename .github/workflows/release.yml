name: Release

# Build macOS + Windows installers and attach them to a GitHub Release.
# Triggers on a version tag (e.g. v1.0.1) or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. pkg can't produce a universal binary (lipo corrupts its
          # appended payload), so we build one arch and a matching arm64 .dmg.
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            pkg_target: node18-macos-arm64
            engine_out: PulseEngine
            tauri_args: "--target aarch64-apple-darwin"
          - os: windows-latest
            rust_target: ""
            pkg_target: node18-win-x64
            engine_out: PulseEngine.exe
            tauri_args: ""

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install engine dependencies
        working-directory: host
        run: npm ci || npm install

      - name: Build engine (pkg, self-contained with GeoIP)
        working-directory: host
        run: npx -y pkg@5.8.1 . --targets ${{ matrix.pkg_target }} --output dist/${{ matrix.engine_out }}

      - name: Stage engine into Tauri resources
        shell: bash
        run: |
          mkdir -p src-tauri/assets
          cp host/dist/${{ matrix.engine_out }} src-tauri/assets/${{ matrix.engine_out }}

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci || npm install

      - name: Build UI
        working-directory: ui
        run: npm run build

      # tauri-action builds the app (prebuilt Tauri CLI — no slow cargo install),
      # creates/updates the GitHub Release for the tag, and uploads the installers.
      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Pulse ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}
          includeUpdaterJson: false
