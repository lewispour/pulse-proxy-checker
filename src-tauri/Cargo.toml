[package]
name = "pulse"
version = "1.0.0"
description = "Pulse — proxy checker"
authors = ["Pulse"]
edition = "2021"

[lib]
name = "proxy_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Name the binary "Pulse" so the macOS Dock/menu show "Pulse" even in dev mode
# (productName in tauri.conf.json only renames the packaged .app).
[[bin]]
name = "Pulse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
# tauri-plugin-updater = "2"   # no auto-updater
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
